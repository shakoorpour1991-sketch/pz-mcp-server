name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    # Job-level env IS visible in step `if` conditions (step-level env is not
    # — the publish gate below would never fire otherwise).
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify package version matches the tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v${TAG} does not match package.json version ${PKG}"
            exit 1
          fi
          echo "Version v${TAG} matches."

      - name: Verify CHANGELOG has an entry for this version
        run: |
          VER="$(node -p "require('./package.json').version")"
          if ! grep -q "^## \[${VER}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '[${VER}]' section"
            exit 1
          fi
          echo "CHANGELOG entry found."

      # Dry-run is the default, safe publish path — no credentials needed and
      # it validates the tarball. The real publish only runs when the repo has
      # an NPM_TOKEN secret configured (freebuff review N6 guardrail).
      - name: Publish (dry-run)
        run: npm publish --dry-run

      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish
