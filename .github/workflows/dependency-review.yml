name: Dependency Review

# Blocks PRs that introduce vulnerable or high-risk dependencies
# (audit: dependency review on pull requests).
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
