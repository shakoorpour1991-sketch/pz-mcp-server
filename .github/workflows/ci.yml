name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    strategy:
      matrix:
        node-version: [22]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # npm test runs `npm run build` itself, so a standalone build step would
      # compile twice (freebuff review L6).
      - run: npm test
      # Coverage report (Node's built-in --experimental-test-coverage). Runs
      # after npm test so dist/ is already built. The --test-coverage-* flags
      # hard-fail the step when line/function/branch coverage drops below the
      # configured thresholds.
      - run: npm run coverage
      - run: npm audit --audit-level=high
