<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for zombie green -->
    <linearGradient id="pzGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a7c59;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d4a34;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for terminal cyan -->
    <linearGradient id="termCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22D3EE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" fill="#0B0B0E"/>
  <rect width="800" height="200" fill="url(#grid)"/>
  
  <!-- Left side: Terminal window -->
  <g transform="translate(40, 30)">
    <!-- Terminal frame -->
    <rect x="0" y="0" width="320" height="140" rx="8" fill="#1A1C23" stroke="rgba(255,255,255,0.1)"/>
    
    <!-- Terminal header -->
    <rect x="0" y="0" width="320" height="28" rx="8" fill="#242731"/>
    <circle cx="14" cy="14" r="5" fill="#FF5F56"/>
    <circle cx="32" cy="14" r="5" fill="#FFBD2E"/>
    <circle cx="50" cy="14" r="5" fill="#27C93F"/>
    
    <!-- Terminal content -->
    <text x="16" y="52" font-family="monospace" font-size="11" fill="#22D3EE">$ npm start</text>
    <text x="16" y="72" font-family="monospace" font-size="10" fill="#9BA1AE">🎮 Project Zomboid MCP Server</text>
    <text x="16" y="88" font-family="monospace" font-size="10" fill="#34D399">✓ Database initialized (SQLite)</text>
    <text x="16" y="104" font-family="monospace" font-size="10" fill="#34D399">✓ Knowledge base indexed (13 topics)</text>
    <text x="16" y="120" font-family="monospace" font-size="10" fill="#34D399">✓ 16 tools ready</text>
    <text x="16" y="140" font-family="monospace" font-size="10" fill="#22D3EE" filter="url(#glow)">● Listening on STDIO</text>
  </g>
  
  <!-- Right side: Connection visualization -->
  <g transform="translate(420, 40)">
    <!-- Claude Desktop box -->
    <rect x="0" y="0" width="140" height="50" rx="6" fill="#1A1C23" stroke="rgba(34,211,238,0.3)"/>
    <text x="70" y="30" text-anchor="middle" font-family="system-ui" font-size="12" fill="#F4F5F8">Claude Desktop</text>
    
    <!-- Arrow -->
    <g transform="translate(140, 25)">
      <line x1="0" y1="0" x2="50" y2="0" stroke="url(#termCyan)" stroke-width="2"/>
      <polygon points="50,-6 60,0 50,6" fill="url(#termCyan)"/>
    </g>
    
    <!-- PZ MCP Server box -->
    <rect x="200" y="0" width="140" height="50" rx="6" fill="url(#pzGreen)" filter="url(#glow)"/>
    <text x="270" y="25" text-anchor="middle" font-family="system-ui" font-size="12" fill="#FFFFFF" font-weight="600">PZ MCP Server</text>
    <text x="270" y="42" text-anchor="middle" font-family="system-ui" font-size="9" fill="rgba(255,255,255,0.8)">Local • Offline • Indexed</text>
    
    <!-- Arrow to game data -->
    <g transform="translate(270, 50)">
      <line x1="0" y1="0" x2="0" y2="35" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
      <polygon points="-6,35 0,45 6,35" fill="rgba(255,255,255,0.3)"/>
    </g>
    
    <!-- Game data cylinder -->
    <g transform="translate(220, 85)">
      <ellipse cx="50" cy="15" rx="50" ry="12" fill="#2D3748" stroke="rgba(255,255,255,0.2)"/>
      <path d="M 0 15 L 0 55 A 50 12 0 0 0 100 55 L 100 15" fill="#1A202C" stroke="rgba(255,255,255,0.2)"/>
      <ellipse cx="50" cy="55" rx="50" ry="12" fill="#2D3748" stroke="rgba(255,255,255,0.2)"/>
      <text x="50" y="40" text-anchor="middle" font-family="monospace" font-size="10" fill="#9BA1AE">SQLite + FTS5</text>
    </g>
    
    <!-- Labels -->
    <text x="165" y="15" font-family="system-ui" font-size="9" fill="#6E7480">MCP protocol</text>
    <text x="290" y="75" font-family="system-ui" font-size="9" fill="#6E7480">vanilla data</text>
  </g>
  
  <!-- Bottom status bar -->
  <rect x="0" y="175" width="800" height="25" fill="rgba(255,255,255,0.03)"/>
  <text x="40" y="192" font-family="monospace" font-size="10" fill="#6E7480">Build 42 compatible</text>
  <text x="200" y="192" font-family="monospace" font-size="10" fill="#6E7480">•</text>
  <text x="220" y="192" font-family="monospace" font-size="10" fill="#6E7480">Node.js ≥22.5</text>
  <text x="340" y="192" font-family="monospace" font-size="10" fill="#6E7480">•</text>
  <text x="360" y="192" font-family="monospace" font-size="10" fill="#6E7480">205 tests passing</text>
</svg>
