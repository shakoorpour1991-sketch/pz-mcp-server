<svg viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Cyberpunk gradient: neon pink to cyan -->
    <linearGradient id="cyberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF2E93;stop-opacity:1">
        <animate attributeName="stop-color" values="#FF2E93;#00F0FF;#FF2E93" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#00F0FF;stop-opacity:1">
        <animate attributeName="stop-color" values="#00F0FF;#FF2E93;#00F0FF" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <!-- Zombie green glow -->
    <linearGradient id="zombieGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#39FF14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00FF41;stop-opacity:1" />
    </linearGradient>
    
    <!-- Data stream cyan -->
    <linearGradient id="dataCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00F0FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0080FF;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glitch text effect -->
    <filter id="glitch">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" result="noise">
        <animate attributeName="baseFrequency" values="0.015;0.02;0.015" dur="0.3s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    
    <!-- Strong glow -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Scanline pattern -->
    <pattern id="scanlines" width="100%" height="4" patternUnits="userSpaceOnUse">
      <rect width="100%" height="2" fill="rgba(0,240,255,0.03)"/>
      <animate attributeName="y" values="0;4;0" dur="0.1s" repeatCount="indefinite"/>
    </pattern>
    
    <!-- Grid with pulse -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,240,255,0.08)" stroke-width="1"/>
      <circle cx="0" cy="0" r="2" fill="rgba(255,46,147,0.3)">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
      </circle>
    </pattern>
    
    <!-- Pulse animation -->
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(0,240,255,0.4)">
        <animate attributeName="stop-opacity" values="0.4;0.8;0.4" dur="1.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:rgba(0,240,255,0)"/>
    </radialGradient>
  </defs>
  
  <!-- Animated background -->
  <rect width="900" height="280" fill="#050508"/>
  <rect width="900" height="280" fill="url(#cyberGrid)"/>
  <rect width="900" height="280" fill="url(#scanlines)"/>
  
  <!-- Corner decorations -->
  <g stroke="url(#cyberGradient)" stroke-width="2" fill="none">
    <path d="M 0 30 L 0 0 L 30 0">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 870 0 L 900 0 L 900 30">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 250 L 0 280 L 30 280">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" begin="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 870 280 L 900 280 L 900 250">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Title with glitch effect -->
  <g transform="translate(450, 50)" text-anchor="middle">
    <text y="0" font-family="monospace" font-size="28" font-weight="bold" fill="url(#cyberGradient)" filter="url(#neonGlow)">
      PZ_MCP_SERVER
      <animate attributeName="letter-spacing" values="2;4;2" dur="5s" repeatCount="indefinite"/>
    </text>
    <text y="28" font-family="monospace" font-size="11" fill="#00F0FF" opacity="0.8">
      [ PROJECT ZOMBOID DATA INTERFACE ]
    </text>
  </g>
  
  <!-- Main workflow: Left terminal -->
  <g transform="translate(50, 80)">
    <!-- Terminal frame with glow -->
    <rect x="0" y="0" width="280" height="160" rx="4" fill="#0A0A0F" stroke="url(#cyberGradient)" stroke-width="1.5" filter="url(#neonGlow)"/>
    
    <!-- Terminal header -->
    <rect x="0" y="0" width="280" height="24" rx="4" fill="#121218" opacity="0.9"/>
    <text x="12" y="16" font-family="monospace" font-size="10" fill="#FF2E93">╭─ root@pz-mcp</text>
    <text x="240" y="16" font-family="monospace" font-size="10" fill="#666">bash</text>
    
    <!-- Typing animation simulation -->
    <g transform="translate(12, 40)">
      <text y="0" font-family="monospace" font-size="10" fill="#00F0FF">$ ./pz-mcp-server init</text>
      
      <!-- Blinking cursor -->
      <rect x="145" y="-8" width="8" height="14" fill="#00F0FF">
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
      </rect>
      
      <text y="22" font-family="monospace" font-size="9" fill="#39FF14">
        <tspan x="0" dy="0">[INIT]</tspan>
        <tspan x="50" dy="0">Loading vanilla database...</tspan>
      </text>
      <text y="42" font-family="monospace" font-size="9" fill="#39FF14">
        <tspan x="0" dy="0">[OK]</tspan>
        <tspan x="50" dy="0">3,848 items indexed</tspan>
      </text>
      <text y="62" font-family="monospace" font-size="9" fill="#39FF14">
        <tspan x="0" dy="0">[OK]</tspan>
        <tspan x="50" dy="0">FTS5 search engine ready</tspan>
      </text>
      <text y="82" font-family="monospace" font-size="9" fill="#00F0FF" filter="url(#neonGlow)">
        <tspan x="0" dy="0">[ACTIVE]</tspan>
        <tspan x="60" dy="0">Listening via MCP/STDIO</tspan>
      </text>
      
      <!-- Data stream lines -->
      <g stroke="rgba(0,240,255,0.2)" stroke-width="1">
        <line x1="0" y="100" x2="260" y2="100">
          <animate attributeName="x2" values="0;260;0" dur="2s" repeatCount="indefinite"/>
        </line>
      </g>
    </g>
  </g>
  
  <!-- Center: Data flow arrows with animation -->
  <g transform="translate(350, 150)">
    <!-- Pulsing connection line -->
    <line x1="0" y1="0" x2="180" y2="0" stroke="url(#dataCyan)" stroke-width="3">
      <animate attributeName="stroke-dasharray" values="0,20;10,10;20,0" dur="1s" repeatCount="indefinite"/>
    </line>
    
    <!-- Moving data packet -->
    <circle cx="90" cy="0" r="6" fill="url(#pulseGlow)">
      <animate attributeName="cx" values="0;180;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="0" r="3" fill="#FFFFFF" filter="url(#neonGlow)">
      <animate attributeName="cx" values="0;180;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Arrow head -->
    <polygon points="180,-8 200,0 180,8" fill="url(#dataCyan)" filter="url(#neonGlow)"/>
    
    <!-- Protocol label -->
    <text x="90" y="25" text-anchor="middle" font-family="monospace" font-size="9" fill="#666">MCP PROTOCOL</text>
  </g>
  
  <!-- Right: Server node -->
  <g transform="translate(580, 110)">
    <!-- Hexagon-like server shape -->
    <path d="M 0 20 L 25 5 L 100 5 L 125 20 L 125 50 L 100 65 L 25 65 L 0 50 Z" 
          fill="#0F0F15" stroke="url(#zombieGreen)" stroke-width="2" filter="url(#neonGlow)"/>
    
    <!-- Inner glow -->
    <ellipse cx="62" cy="35" rx="40" ry="20" fill="url(#pulseGlow)">
      <animate attributeName="rx" values="40;50;40" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    
    <!-- Server text -->
    <text x="62" y="32" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#39FF14" filter="url(#neonGlow)">
      PZ_MCP
    </text>
    <text x="62" y="48" text-anchor="middle" font-family="monospace" font-size="8" fill="#00FF41">
      LOCAL • OFFLINE • INDEXED
    </text>
    
    <!-- Status indicators -->
    <g transform="translate(10, 55)">
      <circle cx="0" cy="0" r="4" fill="#39FF14">
        <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="20" cy="0" r="4" fill="#00F0FF">
        <animate attributeName="opacity" values="1;0.3;1" dur="1s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="40" cy="0" r="4" fill="#FF2E93">
        <animate attributeName="opacity" values="1;0.3;1" dur="1s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  
  <!-- Bottom stats bar -->
  <g transform="translate(50, 250)">
    <rect x="0" y="0" width="800" height="25" fill="rgba(255,46,147,0.05)" rx="4"/>
    
    <!-- Stat 1 -->
    <text x="30" y="17" font-family="monospace" font-size="11" fill="#FF2E93">
      <tspan fill="#FFFFFF">TOOLS:</tspan> 16
    </text>
    
    <!-- Stat 2 -->
    <text x="150" y="17" font-family="monospace" font-size="11" fill="#00F0FF">
      <tspan fill="#FFFFFF">ITEMS:</tspan> 3,848+
    </text>
    
    <!-- Stat 3 -->
    <text x="280" y="17" font-family="monospace" font-size="11" fill="#39FF14">
      <tspan fill="#FFFFFF">TESTS:</tspan> 205 ✓
    </text>
    
    <!-- Stat 4 -->
    <text x="400" y="17" font-family="monospace" font-size="11" fill="#FFBD2E">
      <tspan fill="#FFFFFF">BUILD:</tspan> B42
    </text>
    
    <!-- Stat 5 -->
    <text x="520" y="17" font-family="monospace" font-size="11" fill="#9D4EDD">
      <tspan fill="#FFFFFF">NODE:</tspan> ≥22.5
    </text>
    
    <!-- Stat 6 -->
    <text x="640" y="17" font-family="monospace" font-size="11" fill="#00F0FF">
      <tspan fill="#FFFFFF">DB:</tspan> SQLite+FTS5
    </text>
    
    <!-- Animated scan line across stats -->
    <line x1="0" y1="12" x2="800" y2="12" stroke="rgba(0,240,255,0.3)" stroke-width="1">
      <animate attributeName="y1" values="0;25;0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="0;25;0" dur="3s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Floating particles -->
  <g fill="rgba(0,240,255,0.5)">
    <circle cx="100" cy="100" r="2">
      <animate attributeName="cy" values="100;80;100" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="200" r="1.5">
      <animate attributeName="cy" values="200;180;200" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="80" r="2">
      <animate attributeName="cy" values="80;60;80" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="180" r="1.5">
      <animate attributeName="cy" values="180;160;180" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
