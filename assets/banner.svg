<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">PZ MCP Server cyber terminal workflow</title><desc id="desc">Animated data flows from Project Zomboid files and documentation into a local MCP server and then to an AI client.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05080d"/><stop offset="1" stop-color="#101721"/></linearGradient><linearGradient id="neon" x1="0" x2="1"><stop stop-color="#00f0ff"/><stop offset=".5" stop-color="#9d5cff"/><stop offset="1" stop-color="#9cff57"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#17303a" stroke-width=".8"/></pattern></defs><rect width="1200" height="500" rx="24" fill="url(#bg)"/><rect width="1200" height="500" rx="24" fill="url(#grid)" opacity=".7"/><path d="M0 92H1200M0 408H1200" stroke="#00f0ff" opacity=".18"/><g font-family="monospace"><text x="56" y="72" fill="#00f0ff" font-size="17" letter-spacing="4">LOCAL MODDING INTELLIGENCE // BUILD 42</text><text x="56" y="142" fill="#eaf6ff" font-size="58" font-weight="700">STOP MAKING YOUR AI GUESS.</text><text x="58" y="183" fill="#90a6b8" font-size="19">GAME DATA + DOCS + MOD ANALYSIS → ONE MCP SURFACE</text></g><g transform="translate(58 238)" font-family="monospace"><g><rect width="245" height="116" rx="10" fill="#091018" stroke="#00f0ff" stroke-width="1.5"/><text x="18" y="31" fill="#00f0ff" font-size="14">[01] LOCAL INPUTS</text><text x="18" y="61" fill="#d9e7ee" font-size="17">vanilla game files</text><text x="18" y="86" fill="#d9e7ee" font-size="17">docs · mods · workshop</text></g><g transform="translate(355)"><rect width="280" height="116" rx="10" fill="#101021" stroke="#9d5cff" stroke-width="1.5"/><text x="18" y="31" fill="#c7a8ff" font-size="14">[02] PZ MCP SERVER</text><text x="18" y="61" fill="#fff" font-size="17">SEARCH · GENERATE</text><text x="18" y="86" fill="#fff" font-size="17">VALIDATE · ANALYZE</text><circle cx="252" cy="27" r="5" fill="#9cff57"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/></circle></g><g transform="translate(745)"><rect width="255" height="116" rx="10" fill="#091018" stroke="#9cff57" stroke-width="1.5"/><text x="18" y="31" fill="#9cff57" font-size="14">[03] MCP CLIENT</text><text x="18" y="61" fill="#d9e7ee" font-size="17">AI with local context</text><text x="18" y="86" fill="#d9e7ee" font-size="17">tool calls · results</text></g><path d="M245 58H355M635 58H745" stroke="url(#neon)" stroke-width="2.5" filter="url(#glow)"/><circle r="5" fill="#00f0ff" filter="url(#glow)"><animateMotion dur="2s" repeatCount="indefinite" path="M245,58 H355"/></circle><circle r="5" fill="#9cff57" filter="url(#glow)"><animateMotion dur="2s" begin=".7s" repeatCount="indefinite" path="M635,58 H745"/></circle></g><g font-family="monospace" font-size="13" fill="#708798"><text x="58" y="452">STATUS: ONLINE</text><text x="1000" y="452">STDIO / MCP</text></g><rect x="58" y="468" width="1084" height="3" rx="2" fill="#172631"/><rect x="58" y="468" width="280" height="3" rx="2" fill="#00f0ff" filter="url(#glow)"><animate attributeName="width" values="120;760;280;120" dur="4s" repeatCount="indefinite"/></rect></svg>