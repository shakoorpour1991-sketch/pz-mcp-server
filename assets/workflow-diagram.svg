<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF2E93;stop-opacity:1"><animate attributeName="stop-color" values="#FF2E93;#00F0FF;#FF2E93" dur="3s" repeatCount="indefinite"/></stop>
      <stop offset="100%" style="stop-color:#00F0FF;stop-opacity:1"><animate attributeName="stop-color" values="#00F0FF;#FF2E93;#00F0FF" dur="3s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0,240,255,0.06)" stroke-width="1"/></pattern>
  </defs>
  
  <rect width="800" height="350" fill="#050508"/>
  <rect width="800" height="350" fill="url(#grid)"/>
  
  <!-- Node 1 -->
  <g transform="translate(50, 140)">
    <rect x="0" y="0" width="140" height="70" rx="6" fill="#0A0A0F" stroke="#FF2E93" stroke-width="2" filter="url(#glow)"/>
    <text x="70" y="25" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#FF2E93">parse_game_files</text>
    <text x="70" y="45" text-anchor="middle" font-family="system-ui" font-size="9" fill="#888">SQLite population</text>
    <circle cx="120" cy="15" r="5" fill="#39FF14"><animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/></circle>
  </g>
  
  <!-- Arrow 1 -->
  <line x1="190" y1="175" x2="240" y2="175" stroke="url(#grad1)" stroke-width="2"><animate attributeName="stroke-dasharray" values="0,10;5,5;10,0" dur="1s" repeatCount="indefinite"/></line>
  <polygon points="240,170 260,175 240,180" fill="#00F0FF"/>
  
  <!-- Node 2 -->
  <g transform="translate(260, 140)">
    <rect x="0" y="0" width="140" height="70" rx="6" fill="#0A0A0F" stroke="#00F0FF" stroke-width="2" filter="url(#glow)"/>
    <text x="70" y="25" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#00F0FF">search_vanilla</text>
    <text x="70" y="45" text-anchor="middle" font-family="system-ui" font-size="9" fill="#888">FTS5 queries</text>
    <circle cx="120" cy="15" r="5" fill="#00F0FF"><animate attributeName="opacity" values="1;0.3;1" dur="1s" begin="0.2s" repeatCount="indefinite"/></circle>
  </g>
  
  <!-- Arrow 2 -->
  <line x1="400" y1="175" x2="450" y2="175" stroke="url(#grad1)" stroke-width="2"><animate attributeName="stroke-dasharray" values="0,10;5,5;10,0" dur="1s" begin="0.3s" repeatCount="indefinite"/></line>
  <polygon points="450,170 470,175 450,180" fill="#00F0FF"/>
  
  <!-- Node 3 -->
  <g transform="translate(470, 140)">
    <rect x="0" y="0" width="140" height="70" rx="6" fill="#0A0A0F" stroke="#39FF14" stroke-width="2" filter="url(#glow)"/>
    <text x="70" y="25" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#39FF14">generate_script</text>
    <text x="70" y="45" text-anchor="middle" font-family="system-ui" font-size="9" fill="#888">Template engine</text>
    <circle cx="120" cy="15" r="5" fill="#39FF14"><animate attributeName="opacity" values="1;0.3;1" dur="1s" begin="0.4s" repeatCount="indefinite"/></circle>
  </g>
  
  <!-- Arrow 3 -->
  <line x1="610" y1="175" x2="660" y2="175" stroke="url(#grad1)" stroke-width="2"><animate attributeName="stroke-dasharray" values="0,10;5,5;10,0" dur="1s" begin="0.5s" repeatCount="indefinite"/></line>
  <polygon points="660,170 680,175 660,180" fill="#00F0FF"/>
  
  <!-- Node 4 -->
  <g transform="translate(680, 140)">
    <rect x="0" y="0" width="110" height="70" rx="6" fill="#0A0A0F" stroke="#FF9F43" stroke-width="2" filter="url(#glow)"/>
    <text x="55" y="25" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#FF9F43">validate</text>
    <text x="55" y="45" text-anchor="middle" font-family="system-ui" font-size="9" fill="#888">Syntax check</text>
    <circle cx="90" cy="15" r="5" fill="#FF9F43"><animate attributeName="opacity" values="1;0.3;1" dur="1s" begin="0.6s" repeatCount="indefinite"/></circle>
  </g>
  
  <!-- Bottom row - analysis tools -->
  <g transform="translate(150, 250)">
    <rect x="0" y="0" width="150" height="55" rx="6" fill="#0A0A0F" stroke="#A383FF" stroke-width="1.5"/>
    <text x="75" y="22" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#A383FF">analyze_mod</text>
    <text x="75" y="40" text-anchor="middle" font-family="system-ui" font-size="8" fill="#666">Structure audit</text>
  </g>
  
  <g transform="translate(325, 250)">
    <rect x="0" y="0" width="150" height="55" rx="6" fill="#0A0A0F" stroke="#FF6B81" stroke-width="1.5"/>
    <text x="75" y="22" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#FF6B81">recipe_chain</text>
    <text x="75" y="40" text-anchor="middle" font-family="system-ui" font-size="8" fill="#666">Dependency graph</text>
  </g>
  
  <g transform="translate(500, 250)">
    <rect x="0" y="0" width="150" height="55" rx="6" fill="#0A0A0F" stroke="#4ECDC4" stroke-width="1.5"/>
    <text x="75" y="22" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#4ECDC4">workshop_tools</text>
    <text x="75" y="40" text-anchor="middle" font-family="system-ui" font-size="8" fill="#666">Steam integration</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="url(#grad1)" filter="url(#glow)">TYPICAL_WORKFLOW</text>
  
  <!-- Legend -->
  <g transform="translate(50, 20)">
    <circle cx="0" cy="0" r="4" fill="#39FF14"/><text x="12" y="4" font-family="system-ui" font-size="9" fill="#666">Active</text>
    <circle cx="70" cy="0" r="4" fill="#00F0FF"/><text x="82" y="4" font-family="system-ui" font-size="9" fill="#666">Data Flow</text>
  </g>
</svg>
