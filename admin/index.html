<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0B0B0E" />
<title>pz-mcp-server · Control Deck</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.8/400.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.8/500.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.8/600.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.8/700.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.8/800.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.6/400.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.6/500.css" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
/* ============ pz-mcp-server · Control Deck — final real-MCP build ============ */
:root{
  --bg:#0B0B0E; --text:#F4F5F8; --muted:#9BA1AE; --faint:#6E7480;
  --stroke:rgba(255,255,255,.10); --stroke-soft:rgba(255,255,255,.06);
  --cyan:#22D3EE; --violet:#A78BFA; --emerald:#34D399; --amber:#FBBF24; --rose:#FB7185;
  --accent:#22D3EE; --accent-rgb:34,211,238;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --spring:cubic-bezier(.34,1.56,.64,1); --easeout:cubic-bezier(.22,1,.36,1);
  --tb-h:74px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html.rm *,html.rm *::before,html.rm *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;min-height:100vh}
::selection{background:rgba(var(--accent-rgb),.35)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid rgba(var(--accent-rgb),.95);outline-offset:2px;border-radius:10px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.mono{font-family:var(--font-mono)}
.num{font-variant-numeric:tabular-nums}

#bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:
  radial-gradient(120% 90% at 80% -10%,#101024 0%,transparent 55%),
  radial-gradient(100% 80% at -10% 110%,#071417 0%,transparent 55%),#060609}
#bg::after{content:'';position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:56px 56px;-webkit-mask-image:radial-gradient(90% 70% at 50% 20%,#000 20%,transparent 75%);mask-image:radial-gradient(90% 70% at 50% 20%,#000 20%,transparent 75%)}
#bg::before{content:'';position:absolute;inset:0;z-index:2;opacity:.05;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
.pxl{position:absolute;inset:-12%;will-change:transform}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;will-change:transform}
.b1{width:52vmax;height:52vmax;top:-16vmax;left:-12vmax;background:radial-gradient(circle at 35% 35%,rgba(34,211,238,.34),transparent 62%);animation:drift1 26s ease-in-out infinite alternate}
.b2{width:48vmax;height:48vmax;top:8vmax;right:-16vmax;background:radial-gradient(circle at 60% 40%,rgba(167,139,250,.30),transparent 62%);animation:drift2 32s ease-in-out infinite alternate}
.b3{width:44vmax;height:44vmax;bottom:-18vmax;left:18vw;background:radial-gradient(circle at 50% 50%,rgba(52,211,153,.22),transparent 62%);animation:drift3 38s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate3d(6vmax,4vmax,0) scale(1.08)}}
@keyframes drift2{to{transform:translate3d(-5vmax,6vmax,0) scale(1.12)}}
@keyframes drift3{to{transform:translate3d(4vmax,-5vmax,0) scale(1.06)}}

.glass{background:linear-gradient(160deg,rgba(255,255,255,.085),rgba(255,255,255,.028));border:1px solid var(--stroke);
  -webkit-backdrop-filter:blur(24px) saturate(150%);backdrop-filter:blur(24px) saturate(150%);border-radius:22px;
  box-shadow:0 12px 40px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.07)}
.card{position:relative;transition:transform .35s var(--spring),border-color .3s var(--easeout)}
.card::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
  background:radial-gradient(120% 120% at 50% -10%,rgba(var(--accent-rgb),.14),transparent 55%);transition:opacity .35s var(--easeout)}
.card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.16)}
.card:hover::before{opacity:1}

header#top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:12px clamp(14px,4vw,36px);
  background:rgba(11,11,14,.55);-webkit-backdrop-filter:blur(24px) saturate(150%);backdrop-filter:blur(24px) saturate(150%);border-bottom:1px solid var(--stroke-soft)}
.logo-dot{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,rgba(var(--accent-rgb),.9),rgba(167,139,250,.85));color:#051014;box-shadow:0 4px 18px rgba(var(--accent-rgb),.35)}
.logo-dot svg{width:20px;height:20px}
.h-title{font-weight:700;font-size:15px;letter-spacing:-.01em;line-height:1.1}
.h-sub{font-size:11px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;
  border:1px solid rgba(52,211,153,.35);background:rgba(52,211,153,.10);color:#7EE7B8}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--emerald);animation:pulse 2.2s infinite}
.pill.busy{border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.10);color:#FCD34D}
.pill.busy .dot{background:var(--amber)}
.pill.dead{border-color:rgba(251,113,133,.4);background:rgba(251,113,133,.10);color:#FDA4AF}
.pill.dead .dot{background:var(--rose);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;font-size:11.5px;color:var(--muted);
  border:1px solid var(--stroke-soft);background:rgba(255,255,255,.04);font-family:var(--font-mono);white-space:nowrap}

.btn{min-height:44px;padding:0 18px;border-radius:14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.06);color:var(--text);user-select:none;
  transition:transform .18s var(--spring),background .2s,border-color .2s,box-shadow .25s}
.btn svg{width:17px;height:17px}
.btn:hover{background:rgba(255,255,255,.10)}
.btn:active{transform:scale(.955)}
.btn.primary{background:linear-gradient(135deg,rgba(var(--accent-rgb),.95),rgba(var(--accent-rgb),.65));
  border-color:rgba(var(--accent-rgb),.65);color:#04121a;box-shadow:0 6px 24px rgba(var(--accent-rgb),.30)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:rgba(255,255,255,.06)}
.btn.danger{border-color:rgba(251,113,133,.4);background:rgba(251,113,133,.10);color:#FDA4AF}
.btn.sm{min-height:38px;padding:0 13px;font-size:12.5px;border-radius:11px}
.btn:disabled{opacity:.45;pointer-events:none}
.ibtn{width:44px;height:44px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:13px;
  border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.05);color:var(--muted);
  transition:transform .18s var(--spring),background .2s,color .2s}
.ibtn svg{width:18px;height:18px}
.ibtn:hover{background:rgba(255,255,255,.10);color:var(--text)}
.ibtn:active{transform:scale(.92)}
.ibtn.on{color:rgb(var(--accent-rgb));border-color:rgba(var(--accent-rgb),.45);background:rgba(var(--accent-rgb),.12)}

.field{width:100%;min-height:44px;padding:10px 14px;border-radius:12px;background:rgba(0,0,0,.28);
  border:1px solid rgba(255,255,255,.10);color:var(--text);font-size:14px;transition:border-color .2s,box-shadow .2s}
.field::placeholder{color:var(--faint)}
.field:focus{outline:none;border-color:rgba(var(--accent-rgb),.6);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.18)}
textarea.field{min-height:88px;resize:vertical;font-family:var(--font-mono);font-size:12.5px;line-height:1.6}
select.field{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.f-label{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px 2px}
.f-hint{font-size:11px;color:var(--faint);margin:4px 2px 0}

main{max-width:1240px;margin:0 auto;padding:22px clamp(14px,4vw,36px) calc(var(--tb-h) + 48px)}
.view{animation:viewIn .5s var(--easeout) both}
@keyframes viewIn{from{opacity:0;transform:translateY(16px) scale(.995)}}
.sec-title{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:26px 2px 12px}
.sec-title:first-child{margin-top:4px}

#connBanner{display:none;align-items:center;gap:12px;margin:0 0 18px;padding:14px 18px;border-radius:16px;font-size:13.5px;
  border:1px solid rgba(251,113,133,.35);background:rgba(251,113,133,.08);color:#FDA4AF}
#connBanner.show{display:flex}
#connBanner code{font-family:var(--font-mono);font-size:12px;background:rgba(0,0,0,.35);padding:2px 8px;border-radius:7px;color:#FECDD3}

.metrics-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media(max-width:1080px){.metrics-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.metrics-grid{grid-template-columns:1fr}}
.metric{padding:18px 18px 12px;min-height:172px;display:flex;flex-direction:column;justify-content:space-between}
.m-top{display:flex;gap:16px;align-items:center}
.ring-wrap{position:relative;width:72px;height:72px;flex:none}
.ring{width:72px;height:72px;transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:6.5;stroke-linecap:round}
.ring-bg{stroke:rgba(255,255,255,.08)}
.ring-fg{stroke:var(--rc,var(--cyan));stroke-dasharray:188.5;stroke-dashoffset:188.5;transition:stroke-dashoffset 1s var(--easeout);filter:drop-shadow(0 0 6px var(--rc,var(--cyan)))}
.ring-c{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.m-label{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.m-value{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.15;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.m-value small{font-size:14px;font-weight:600;color:var(--muted);margin-left:3px}
.m-sub{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:12px;color:var(--faint)}
.spark{width:100%;height:38px;display:block;margin-top:12px;overflow:visible}
.spark path.l{fill:none;stroke:var(--rc,var(--cyan));stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.95}
.spark path.a{fill:var(--rc,var(--cyan));opacity:.10}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.b-ok{background:rgba(52,211,153,.12);color:#7EE7B8;border:1px solid rgba(52,211,153,.3)}
.b-info{background:rgba(var(--accent-rgb),.12);color:rgb(var(--accent-rgb));border:1px solid rgba(var(--accent-rgb),.35)}
.b-vio{background:rgba(167,139,250,.12);color:#C4B5FD;border:1px solid rgba(167,139,250,.32)}
.b-warn{background:rgba(251,191,36,.12);color:#FCD34D;border:1px solid rgba(251,191,36,.32)}
.b-err{background:rgba(251,113,133,.12);color:#FDA4AF;border:1px solid rgba(251,113,133,.32)}
.b-dim{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--stroke-soft)}

.status-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
@media(max-width:920px){.status-grid{grid-template-columns:1fr}}
.panel-card{padding:18px}
.panel-card h3{margin:0 0 14px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel-card h3 svg{width:15px;height:15px;color:rgb(var(--accent-rgb))}
.krow{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:36px;font-size:13px;border-bottom:1px solid var(--stroke-soft)}
.krow:last-child{border-bottom:0}
.krow .k{color:var(--muted)}
.krow .v{font-family:var(--font-mono);font-size:12px;text-align:right;overflow:hidden;text-overflow:ellipsis;max-width:62%}
.trow{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 4px;border-bottom:1px solid var(--stroke-soft);font-size:13.5px}
.trow:last-child{border-bottom:0}
.tdot{width:8px;height:8px;border-radius:50%;flex:none}
.evrow{display:flex;gap:10px;min-height:34px;align-items:flex-start;padding:4px 2px;font-size:12px;border-bottom:1px solid var(--stroke-soft)}
.evrow:last-child{border-bottom:0}
.ev-t{color:var(--faint);font-family:var(--font-mono);font-size:10.5px;flex:none;padding-top:2px}
.srvlog{height:230px;overflow-y:auto;font-family:var(--font-mono);font-size:11px;line-height:1.8;color:var(--muted)}
.srvlog .ln{white-space:pre-wrap;word-break:break-all}
.srvlog .ln.warn{color:#FCD34D}.srvlog .ln.err{color:#FDA4AF}

.play-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;align-items:start}
@media(max-width:1000px){.play-grid{grid-template-columns:1fr}}
.tool-stack{display:flex;flex-direction:column;gap:12px}
.tool{padding:0;overflow:hidden}
.tool.active{border-color:rgba(var(--accent-rgb),.5)}
.tool .glow{position:absolute;inset:-40px;border-radius:50%;pointer-events:none;opacity:0;z-index:-1;
  background:radial-gradient(closest-side,rgba(var(--accent-rgb),.30),transparent 70%);filter:blur(18px);will-change:transform,opacity}
.tool.active .glow{animation:breathe 1.9s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35;transform:scale(.94)}50%{opacity:.85;transform:scale(1.05)}}
.tool-head{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:64px;text-align:left;border-radius:22px}
.tool-ic{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;
  background:rgba(var(--accent-rgb),.12);border:1px solid rgba(var(--accent-rgb),.25);color:rgb(var(--accent-rgb))}
.tool-ic svg{width:19px;height:19px}
.tool-name{font-family:var(--font-mono);font-size:13.5px;font-weight:600}
.tool-desc{font-size:12px;color:var(--muted);margin-top:1px;line-height:1.4}
.tool-chv{margin-left:auto;color:var(--faint);transition:transform .35s var(--spring);flex:none}
.tool-chv svg{width:16px;height:16px;display:block}
.tool.open .tool-chv{transform:rotate(180deg)}
.tool-panel{height:0;overflow:hidden;opacity:0}
.tool-panel-in{padding:14px 16px 16px;border-top:1px solid var(--stroke-soft);display:flex;flex-direction:column;gap:12px}
.tool-panel-in .frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.tool-panel-in .frow{grid-template-columns:1fr}}
.run-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(var(--accent-rgb),.25);border-top-color:rgb(var(--accent-rgb));animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* Result viewer + markdown rendering */
#resultCard{margin-bottom:16px;overflow:hidden}
#resultHead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--stroke-soft);flex-wrap:wrap}
#resultBody{padding:14px 16px;max-height:480px;overflow-y:auto;font-size:13px;line-height:1.7}
.md-h{font-weight:700;font-size:13.5px;margin:12px 0 6px}
.md-h:first-child{margin-top:0}
.md-p{margin:3px 0}
.md-li{margin:2px 0 2px 6px;padding-left:14px;position:relative}
.md-li::before{content:'›';position:absolute;left:2px;color:rgb(var(--accent-rgb));font-weight:700}
.md-li.num{padding-left:0}
.md-li.num::before{content:none}
.md-code{font-family:var(--font-mono);font-size:11.5px;background:rgba(255,255,255,.07);border:1px solid var(--stroke-soft);padding:1px 6px;border-radius:6px}
.code-block{margin:10px 0;border-radius:14px;background:rgba(0,0,0,.40);border:1px solid rgba(var(--accent-rgb),.22);overflow:hidden}
.code-block pre{margin:0;padding:14px 16px;font-family:var(--font-mono);font-size:12px;line-height:1.7;overflow-x:auto;white-space:pre;color:#DDE1E8}

.console{display:flex;flex-direction:column;overflow:hidden}
.console-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--stroke-soft);flex-wrap:wrap}
.console-head h3{margin:0;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.log-body{height:420px;overflow-y:auto;padding:8px;font-family:var(--font-mono);font-size:12px;scroll-behavior:smooth}
@media(max-width:620px){.log-body{height:300px}}
.log-line{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto 20px;align-items:center;gap:8px;
  min-height:44px;padding:4px 10px;border-radius:12px;cursor:pointer;transition:background .15s,transform .15s;animation:logIn .35s var(--easeout) both}
@keyframes logIn{from{opacity:0;transform:translateX(-8px)}}
.log-line:hover{background:rgba(255,255,255,.055)}
.log-line:active{transform:scale(.995)}
.lg-dir{font-weight:700;text-align:center}
.lg-dir.req{color:var(--cyan)}.lg-dir.res{color:var(--emerald)}.lg-dir.srv{color:var(--violet)}.lg-dir.sys{color:var(--amber)}
.lg-method{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-method .id{color:var(--faint)}
.lg-lat{color:var(--violet);font-size:11px}
.lg-time{color:var(--faint);font-size:11px}
.lg-chv{color:var(--faint);opacity:0;transition:opacity .2s}
.log-line:hover .lg-chv,.log-line:focus-visible .lg-chv{opacity:1}
.lg-chv svg{width:14px;height:14px;display:block}
.log-empty{color:var(--faint);text-align:center;padding:60px 0;font-family:'Inter'}
.console-foot{padding:9px 16px;border-top:1px solid var(--stroke-soft);font-size:11.5px;color:var(--faint);display:flex;justify-content:space-between;gap:8px}
.kbd{font-family:var(--font-mono);font-size:10.5px;padding:2px 6px;border-radius:6px;border:1px solid var(--stroke);background:rgba(255,255,255,.05);color:var(--muted)}

.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat-tile{padding:14px 16px;text-align:left}
.stat-tile .tv{font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat-tile .tk2{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.md-out{margin:0;padding:16px;border-radius:14px;background:rgba(0,0,0,.30);border:1px solid var(--stroke-soft);
  font-size:13px;line-height:1.75;min-height:120px;max-height:460px;overflow-y:auto}

.set-grid{display:grid;grid-template-columns:1fr;gap:16px;max-width:780px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:52px;padding:4px 2px;border-bottom:1px solid var(--stroke-soft)}
.set-row:last-child{border-bottom:0}
.set-row .lbl{font-size:14px;font-weight:500}
.set-row .sub{font-size:12px;color:var(--faint);margin-top:1px}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.swatch{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--stroke);background:rgba(255,255,255,.04);transition:transform .2s var(--spring),border-color .2s}
.swatch:active{transform:scale(.9)}
.swatch .dotc{width:22px;height:22px;border-radius:50%}
.swatch.sel{border-color:rgba(255,255,255,.55);box-shadow:0 0 0 3px rgba(255,255,255,.10)}
.color-well{width:44px;height:44px;border-radius:14px;border:1px dashed rgba(255,255,255,.3);position:relative;display:grid;place-items:center;overflow:hidden}
.color-well input{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);opacity:0;cursor:pointer}
.color-well .cw-dot{width:22px;height:22px;border-radius:50%;pointer-events:none;background:conic-gradient(#22D3EE,#A78BFA,#34D399,#FBBF24,#FB7185,#22D3EE)}
.switch{box-sizing:content-box;width:50px;height:28px;padding:8px 0;position:relative;flex:none;border-radius:999px}
.switch .trk{position:absolute;inset:8px 0;border-radius:999px;background:rgba(255,255,255,.14);transition:background .25s}
.switch .knb{position:absolute;top:11px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.45);transition:transform .32s var(--spring)}
.switch[aria-checked="true"] .trk{background:rgba(var(--accent-rgb),.85)}
.switch[aria-checked="true"] .knb{transform:translateX(22px)}

nav#tabbar{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);

#tabInd{position:absolute;top:6px;left:0;height:calc(100% - 12px);border-radius:18px;
  background:rgba(var(--accent-rgb),.14);border:1px solid rgba(var(--accent-rgb),.38);
  box-shadow:0 0 22px rgba(var(--accent-rgb),.22),inset 0 1px 0 rgba(255,255,255,.10);
  transition:transform .5s var(--spring),width .5s var(--spring);will-change:transform}
.tab{position:relative;z-index:1;min-width:72px;min-height:56px;padding:7px 10px 6px;border-radius:18px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);transition:color .25s,transform .18s var(--spring)}
.tab:active{transform:scale(.92)}
.tab svg{width:22px;height:22px;transition:transform .35s var(--spring)}
.tab span{font-size:10px;font-weight:600;white-space:nowrap}
.tab.active{color:#fff}
.tab.active svg{transform:translateY(-1px) scale(1.08);filter:drop-shadow(0 0 8px rgba(var(--accent-rgb),.7))}
@media(max-width:400px){.tab{min-width:62px;padding:7px 6px 6px}}

.sk{position:relative;overflow:hidden;background:rgba(255,255,255,.05);border-radius:14px}
.sk::after{content:'';position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.085),transparent);animation:shimmer 1.5s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.sk-card{padding:18px;display:flex;gap:16px;align-items:center}
.sk-line{height:12px;margin:8px 0}

#terminal{position:fixed;left:0;top:0;z-index:70;display:none;will-change:transform}
#terminal.open{display:block}
.term-shell{display:flex;flex-direction:column;width:100%;height:100%;border-radius:18px;overflow:hidden;
  background:rgba(13,13,18,.82);border:1px solid rgba(255,255,255,.13);

@keyframes termIn{from{opacity:0;transform:translateY(16px) scale(.96)}}
.term-head{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;min-height:48px;border-bottom:1px solid var(--stroke-soft);

.term-head:active{cursor:grabbing}
.tl-dots{display:flex;gap:6px;flex:none}
.tl-dots i{width:11px;height:11px;border-radius:50%;display:block}
.tl-dots i:nth-child(1){background:#FF5F57}.tl-dots i:nth-child(2){background:#FEBC2E}.tl-dots i:nth-child(3){background:#28C840}
.term-title{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.term-body{flex:1;overflow:auto;padding:14px 16px;margin:0;font-family:var(--font-mono);font-size:12px;line-height:1.7;color:#DDE1E8}
.term-resize{position:absolute;right:0;bottom:0;width:26px;height:26px;cursor:nwse-resize;display:grid;place-items:center;color:var(--faint);touch-action:none}
.term-resize svg{width:12px;height:12px}
.tk-key{color:#7DD3FC}.tk-str{color:#6EE7B7}.tk-num{color:#C4B5FD}.tk-bool{color:#FCD34D}.tk-null{color:#9BA1AE}

#toasts{position:fixed;top:16px;right:16px;z-index:90;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:min(380px,calc(100vw - 32px))}

a.link{color:rgb(var(--accent-rgb));text-decoration:none;font-weight:600}

<script>
'use strict';
/* ================================================================
   Control Deck client — talks to admin/bridge.mjs (same origin)
   ================================================================ */

/* ---------- helpers ---------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pad = n => String(n).padStart(2,'0');
const fmtClock = t => { const d = new Date(t); return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); };
function hexToRgb(h){ h = h.replace('#',''); if (h.length===3) h = h.split('').map(c=>c+c).join(''); const n = parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255].join(','); }
function walkUp(el, sel){ while (el && el !== document.body){ if (el.matches && el.matches(sel)) return el; el = el.parentElement; } return null; }
function fmtUp(sec){
  if (sec == null) return '—';
  const d = Math.floor(sec/86400), h = Math.floor(sec%86400/3600), m = Math.floor(sec%3600/60), s = sec%60;
  return (d ? d+'d ' : '') + pad(h)+':'+pad(m)+':'+pad(s);
}
function hlJSON(obj){
  const s = esc(JSON.stringify(obj, null, 2));
  return s.replace(/("(?:\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"(?:\s*:)?|\b(?:true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+\-]?\d+)?)/g, m => {
    let cls = 'tk-num';
    if (/^"/.test(m)) cls = /:\s*$/.test(m) ? 'tk-key' : 'tk-str';
    else if (/true|false/.test(m)) cls = 'tk-bool';
    else if (/null/.test(m)) cls = 'tk-null';
    return '<span class="'+cls+'">'+m+'</span>';
  });
}
/* PZ script syntax highlighting */
function hlPZ(code){
  let s = esc(code);
  s = s.replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="tk-null">$1</span>');
  s = s.replace(/^(\s*)([A-Za-z]\w*)(\s*[=:])/gm, '$1<span class="tk-key">$2</span>$3');
  s = s.replace(/\b(module|item|recipe|evolvedrecipe|fixing|sound|vehicle|clip|keep)\b/g, '<span class="tk-bool">$1</span>');
  s = s.replace(/\b(TRUE|FALSE)\b/g, '<span class="tk-bool">$1</span>');
  s = s.replace(/(^|[\s=:,(])(-?\d+(?:\.\d+)?)(?=[\s,;)}]|$)/gm, '$1<span class="tk-num">$2</span>');
  return s;
}
/* markdown-lite renderer for real tool output */
function mdInline(s){
  return s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code class="md-code">$1</code>');
}
function mdProse(t){
  let html = '';
  for (const raw of String(t).split('\n')){
    const l = raw.trim();
    if (!l) continue;
    if (/^#{1,3}\s/.test(l)) html += '<div class="md-h">'+mdInline(esc(l.replace(/^#{1,3}\s+/, '')))+'</div>';
    else if (/^[-•]\s/.test(l)) html += '<div class="md-li">'+mdInline(esc(l.replace(/^[-•]\s+/, '')))+'</div>';
    else if (/^\d+\.\s/.test(l)) html += '<div class="md-li num">'+mdInline(esc(l))+'</div>';
    else html += '<div class="md-p">'+mdInline(esc(l))+'</div>';
  }
  return html;
}
function renderMD(text){
  const segs = String(text).split('```');
  let out = '';
  segs.forEach((seg, i) => {
    if (i % 2 === 1){
      const code = seg.replace(/^[a-zA-Z]*\r?\n/, '');
      out += '<div class="code-block"><pre>'+hlPZ(code.replace(/\r/g,''))+'</pre></div>';
    } else out += mdProse(seg);
  });
  return out || '<div class="md-p" style="color:var(--faint)">(empty result)</div>';
}

/* ---------- real MCP client (via bridge) ---------- */
async function rpc(method, params, opts = {}){
  const msg = { jsonrpc:'2.0', method, params: params ?? {} };
  if (!opts.notify) msg.id = ++S.seq;
  let res;
  try {
    res = await fetch('/rpc', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(msg) });
  } catch (e) { setConn('offline'); throw new Error('bridge unreachable'); }
  if (opts.notify) return null;
  const reply = await res.json();
  const dt = Math.round(performance.now() - (msg._t0 || 0));
  if (method === 'tools/call'){
    S.lat.calls++;
    if (reply.id !== undefined) S.resLatency.set(reply.id, dt);
  }
  if (reply.error) { const e = new Error(reply.error.message); e.code = reply.error.code; throw e; }
  return reply;
}
function recordLatency(dt){
  S.lat.ema = S.lat.ema == null ? dt : Math.round(S.lat.ema * 0.65 + dt * 0.35);
  S.lat.spark.push(dt); if (S.lat.spark.length > 24) S.lat.spark.shift();
  updateStatusDom();
}
async function handshake(){
  setConn('connecting');
  const init = await rpc('initialize', {
    protocolVersion:'2025-06-18', capabilities:{},
    clientInfo:{ name:'pz-control-deck', version:'1.0.0' },
  });
  S.serverInfo = init.result.serverInfo; S.protocol = init.result.protocolVersion;
  $('#verBadge').textContent = 'v' + (S.serverInfo?.version || '?');
  await rpc('notifications/initialized', {}, { notify:true });
  const list = await rpc('tools/list', {});
  S.tools = list.result.tools || [];
  S.handshaken = true;
  setConn('live');
  addEvent('handshake · ' + S.tools.length + ' tools registered');
  renderView();
}

/* ---------- SSE wire ---------- */
function connectEvents(){
  const es = new EventSource('/events');
  es.onopen = () => { if (!S.handshaken) setConn('connecting'); };
  es.onerror = () => { if (!S.handshaken) setConn('offline'); };
  es.addEventListener('hello', e => {
    const d = JSON.parse(e.data);
    S.serverLog = d.logs || [];
    if (d.telemetry) applyTelemetry(d.telemetry);
    renderServerLog();
  });
  es.addEventListener('frame', e => onFrame(JSON.parse(e.data)));
  es.addEventListener('telemetry', e => applyTelemetry(JSON.parse(e.data)));
  es.addEventListener('log', e => {
    S.serverLog.push(JSON.parse(e.data));
    if (S.serverLog.length > 200) S.serverLog.shift();
    renderServerLog();
  });
  es.addEventListener('status', e => {
    const d = JSON.parse(e.data);
    if (d.state === 'restarting'){ S.handshaken = false; addEvent('server restarting…'); }
  });
}
function onFrame(f){
  if (f.dir === 'req' && f.msg.id !== undefined) S.methodById.set(f.msg.id, f.msg.method);
  const entry = { id:'F' + (++S.fid), dir:f.dir, t:f.t, msg:f.msg,
    method: f.msg.method || (f.dir === 'res' ? (S.methodById.get(f.msg.id) || 'response') : 'notification') };
  if (f.dir === 'res') entry.latency = S.resLatency.get(f.msg.id);
  S.logs.push(entry); if (S.logs.length > 300) S.logs.shift();
  appendLogLine(entry);
  const cnt = $('#logCount'); if (cnt) cnt.textContent = S.logs.length + ' frames';
  if (term.open && S.settings.follow) showPayload(entry);
}

/* ---------- telemetry ---------- */
function applyTelemetry(t){
  S.telemetry = t;
  if (t.memMB != null){ S.memSpark.push(t.memMB); if (S.memSpark.length > 24) S.memSpark.shift(); }
  S.sesSpark.push(t.sessions || 0); if (S.sesSpark.length > 24) S.sesSpark.shift();
  S.itemsSpark.push(t.db?.total || 0); if (S.itemsSpark.length > 24) S.itemsSpark.shift();
  S.upSpark.push(1); if (S.upSpark.length > 24) S.upSpark.shift();
  $('#upChip').textContent = '⏱ ' + fmtUp(t.uptime);
  updateStatusDom(); renderDbStats();
}
function addEvent(txt){

function setRing(id, pct, center){
  const fg = $('#rg-'+id), c = $('#rc-'+id);
  if (!fg) return;
  fg.style.strokeDashoffset = (188.5 * (1 - clamp(pct,0,1))).toFixed(2);
  if (c && center !== undefined) c.textContent = center;
}
function sparkPaths(arr){
  if (!arr || arr.length < 2) return null;
  const w=120, h=36, p=3, min = Math.min.apply(null,arr), max = Math.max.apply(null,arr), span = (max-min)||1;
  const step = (w - p*2)/(arr.length - 1);
  let d = '';
  arr.forEach((v,i)=>{ d += (i?'L':'M') + (p+i*step).toFixed(1) + ',' + (h - p - ((v-min)/span)*(h-p*2)).toFixed(1); });
  return { line:d, area:d + 'L' + (w-p) + ',' + (h-p) + 'L' + p + ',' + (h-p) + 'Z' };
}
function drawSpark(id, arr){
  const paths = sparkPaths(arr); if (!paths) return;
  const l = $('#sl-'+id), a = $('#sa-'+id);
  if (l) l.setAttribute('d', paths.line);
  if (a) a.setAttribute('d', paths.area);
}

function renderServerLog(){
  const box = $('#srvLog'); if (!box) return;
  const tail = S.serverLog.slice(-80);
  box.innerHTML = tail.map(l => {
    let line = l.line, cls = '';
    try {
      const j = JSON.parse(l.line);
      const lvl = {10:'TRC',20:'DBG',30:'INF',40:'WRN',50:'ERR',60:'FTL'}[j.level] || 'LOG';
      cls = j.level >= 50 ? 'err' : j.level >= 40 ? 'warn' : '';
      const t = j.time ? new Date(j.time).toTimeString().slice(0,8) : '';
      line = t + ' ' + lvl + ' · ' + (j.msg || JSON.stringify(j));
    } catch {
      if (/error|❌|💥/i.test(l.line)) cls = 'err';
      else if (/warn|⚠/i.test(l.line)) cls = 'warn';
    }
    return '<div class="ln '+cls+'">'+esc(line)+'</div>';
  }).join('');
  box.scrollTop = box.scrollHeight;
}

function fieldsForTool(tool){
  const schema = tool.inputSchema || {};
  const props = schema.properties || {};
  const req = new Set(schema.required || []);
  return Object.entries(props).map(([k, s]) => {
    let kind = 'text';
    if (s.enum) kind = 'select';
    else if (s.type === 'boolean') kind = 'bool';
    else if (s.type === 'number' || s.type === 'integer') kind = 'num';
    else if (s.type === 'array') kind = 'list';
    else if (s.type === 'object' || s.additionalProperties) kind = 'json';
    else if (k === 'content') kind = 'textarea';
    const def = (EXAMPLES[tool.name] || {})[k] ?? s.default;
    return { k, kind, s, required: req.has(k), def };
  });
}

  if (f.kind === 'select'){

      f.s.enum.map(o => '<option value="'+esc(o)+'"'+(o===f.def?' selected':'')+'>'+esc(o)+'</option>').join('') + '</select>'+hint+'</div>';

  if (f.kind === 'num'){

  return '<div><label class="f-label" for="'+fid+'">'+esc(f.k)+reqTag+'</label><input class="field" id="'+fid+'" value="'+esc(f.def ?? '')+'">'+hint+'</div>';

function expandPanel(card, open){
  const panel = $('.tool-panel', card), head = $('.tool-head', card);
  if (open){
    card.classList.add('open'); head.setAttribute('aria-expanded','true');
    panel.style.opacity = '0'; panel.style.height = '0px';
    const a = panel.animate([{height:'0px',opacity:0},{height:panel.scrollHeight+'px',opacity:1}],{duration:400,easing:'cubic-bezier(.22,1.1,.36,1)'});
    a.onfinish = () => { panel.style.height = 'auto'; panel.style.opacity = '1'; };
  } else {
    head.setAttribute('aria-expanded','false');
    const h = panel.offsetHeight; panel.style.height = h + 'px'; void panel.offsetWidth;
    const a = panel.animate([{height:h+'px',opacity:1},{height:'0px',opacity:0}],{duration:320,easing:'cubic-bezier(.4,0,.2,1)'});
    a.onfinish = () => { card.classList.remove('open'); panel.style.height = '0px'; };
  }
}
function toggleTool(name){
  const prev = S.openTool;
  S.openTool = prev === name ? null : name;
  if (prev && prev !== name){ const old = $('#tool-' + CSS.escape(prev)); if (old) expandPanel(old, false); }
  const card = $('#tool-' + CSS.escape(name));
  if (card) expandPanel(card, S.openTool === name);
}
function collectArgs(tool){
  const args = {};
  for (const f of fieldsForTool(tool)){
    const el = $('#pf-' + tool.name + '-' + f.k);
    if (!el) continue;
    let v;
    if (f.kind === 'bool') v = el.getAttribute('aria-checked') === 'true';
    else if (f.kind === 'num'){ if (el.value === '') { if (f.required){ toast(f.k + ' is required', 'warn'); return null; } continue; } v = Number(el.value); }
    else if (f.kind === 'list'){ const lines = el.value.split('\n').map(x => x.trim()).filter(Boolean); if (!lines.length){ if (f.required){ toast(f.k + ' is required','warn'); return null; } continue; } v = lines; }
    else if (f.kind === 'json'){ try { v = JSON.parse(el.value || '{}'); } catch (e){ toast(f.k + ': invalid JSON','warn'); return null; } }
    else { if (el.value === ''){ if (f.required){ toast(f.k + ' is required','warn'); return null; } continue; } v = el.value; }
    args[f.k] = v;
  }
  return args;
}
function markTool(name, running){
  const card = $('#tool-' + CSS.escape(name)); if (!card) return;
  card.classList.toggle('active', running);
  const lbl = $('.run-label', card), btn = $('[data-act="run-tool"]', card);
  if (lbl) lbl.innerHTML = running ? '<span class="spinner"></span> Executing…' : ICONS.play + ' Run ' + esc(name);
  if (btn) btn.disabled = running;
}
async function callTool(name, args){
  if (!S.handshaken){ toast('Not connected — waiting for handshake','warn'); return; }
  if (S.view !== 'playground') switchView('playground');
  markTool(name, true);
  const t0 = performance.now();
  try {
    const reply = await rpc('tools/call', { name, arguments: args });
    const dt = Math.round(performance.now() - t0);
    recordLatency(dt);
    const text = reply.result?.content?.map(c => c.text || '').join('\n') || '(empty result)';
    addEvent(name + ' · ' + dt + 'ms');
    showResult(name, text, dt, reply, false);
    toast(name + ' completed · ' + dt + 'ms');
  } catch (e){
    addEvent(name + ' failed');
    showResult(name, String(e.message || e), Math.round(performance.now() - t0), null, true);
    toast(name + ' failed: ' + e.message, 'warn');
  } finally { markTool(name, false); }
}
function showResult(name, text, dt, reply, isError){
  const card = $('#resultCard'); if (!card) return;
  const fences = text.match(/```[\s\S]*?```/);
  const script = fences ? fences[0].replace(/^```[a-zA-Z]*\r?\n?/, '').replace(/```$/, '') : null;
  S.lastResult = { name, text, script, reply };
  card.style.display = '';
  $('#resultHead').innerHTML =
    '<span class="tool-ic" style="width:32px;height:32px;border-radius:9px">'+(ICONS[TOOL_ICONS[name]]||ICONS.spark)+'</span>' +
    '<span class="mono" style="font-size:13px;font-weight:600">'+esc(name)+'</span>' +
    (isError ? '<span class="badge b-err">✖ error</span>' : '<span class="badge b-ok">✓ '+dt+'ms</span>') +
    '<span style="flex:1"></span>' +
    (script ? '<button class="btn sm" data-act="copy-script">'+ICONS.copy+' Copy script</button>' : '') +
    (script && name === 'generate_script' ? '<button class="btn sm primary" data-act="to-validate">'+ICONS.shield+' Validate it</button>' : '') +
    (reply ? '<button class="btn sm ghost" data-act="inspect-raw">raw JSON</button>' : '') +
    '<button class="ibtn" style="width:36px;height:36px;border-radius:10px" data-act="close-result" aria-label="Close result">'+ICONS.x+'</button>';
  $('#resultBody').innerHTML = isError
    ? '<div class="md-p" style="color:#FDA4AF">'+esc(text)+'</div>'
    : renderMD(text);
  card.scrollIntoView({ behavior:'smooth', block:'nearest' });
}
function sendToValidate(script){
  switchView('playground');
  setTimeout(() => {
    if (S.openTool && S.openTool !== 'validate_script') toggleTool(S.openTool);
    if (S.openTool !== 'validate_script') toggleTool('validate_script');
    const ta = $('#pf-validate_script-content');
    if (ta){ ta.value = script; ta.focus(); }
    const el = $('#tool-validate_script');
    el?.scrollIntoView({ behavior:'smooth', block:'center' });
    toast('Generated script loaded into validate_script — press Run');
  }, 80);
}

/* ==================== TERMINAL ==================== */
const term = { open:false, x:0, y:0, w:540, h:380, max:false, prev:null, current:null };
const termEl = () => $('#terminal');
function termApply(){
  const el = termEl();
  el.style.transform = 'translate3d('+term.x+'px,'+term.y+'px,0)';
  el.style.width = term.w + 'px'; el.style.height = term.h + 'px';
}
function termPositionDefault(){
  if (innerWidth < 640){ term.w = innerWidth - 16; term.h = Math.round(innerHeight * .62); term.x = 8; term.y = innerHeight - term.h - 96; }
  else { term.w = 540; term.h = 380; term.x = innerWidth - term.w - 28; term.y = Math.max(80, innerHeight - term.h - 130); }
}
function showPayload(entry){
  term.current = entry;
  const idp = entry.msg?.id !== undefined ? ' #' + entry.msg.id : '';
  $('#termTitle').textContent = 'mcp://' + entry.dir + ' · ' + (entry.method || '') + idp + ' · ' + fmtClock(entry.t);
  $('#termBody').innerHTML = hlJSON(entry.msg);
}
function openTerminal(entry){
  if (!term.open){ termPositionDefault(); termApply(); }
  termEl().classList.add('open'); term.open = true;
  showPayload(entry || S.logs[S.logs.length - 1] || { dir:'sys', method:'idle', t:Date.now(), msg:{ note:'No frames yet — run a tool in the Playground.' } });
  $('#termClose').focus({ preventScroll:true });
}
function closeTerminal(){ termEl().classList.remove('open'); term.open = false; }
function toggleTermMax(){
  if (!term.max){ term.prev = { x:term.x, y:term.y, w:term.w, h:term.h }; term.x = 10; term.y = 10; term.w = innerWidth - 20; term.h = innerHeight - 20; term.max = true; }
  else { Object.assign(term, term.prev); term.max = false; }
  termApply();
}
function bindTerminal(){
  const head = $('#termHead');
  let drag = null;
  head.addEventListener('pointerdown', e => {
    if (e.target.closest('button') || term.max) return;
    drag = { mode:'move', px:e.clientX, py:e.clientY, x:term.x, y:term.y };
    head.setPointerCapture(e.pointerId);
  });
  $('#termResize').addEventListener('pointerdown', e => {
    if (term.max) return;
    drag = { mode:'resize', px:e.clientX, py:e.clientY, w:term.w, h:term.h };
    e.target.setPointerCapture(e.pointerId);
  });
  const onMove = e => {
    if (!drag) return;
    const dx = e.clientX - drag.px, dy = e.clientY - drag.py;
    if (drag.mode === 'move'){ term.x = clamp(drag.x + dx, -term.w + 80, innerWidth - 80); term.y = clamp(drag.y + dy, 0, innerHeight - 56); }
    else { term.w = clamp(drag.w + dx, 300, innerWidth - 16); term.h = clamp(drag.h + dy, 220, innerHeight - 16); }
    termApply();
  };
  head.addEventListener('pointermove', onMove);
  $('#termResize').addEventListener('pointermove', onMove);
  head.addEventListener('pointerup', () => drag = null);
  $('#termResize').addEventListener('pointerup', () => drag = null);
  head.addEventListener('keydown', e => {
    if (!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key) || term.max) return;
    e.preventDefault();
    const s = 28;
    if (e.key === 'ArrowLeft') term.x -= s; if (e.key === 'ArrowRight') term.x += s;
    if (e.key === 'ArrowUp') term.y -= s; if (e.key === 'ArrowDown') term.y += s;
    term.x = clamp(term.x, -term.w + 80, innerWidth - 80); term.y = clamp(term.y, 0, innerHeight - 56);
    termApply();
  });
  $('#termClose').addEventListener('click', closeTerminal);
  $('#termMax').addEventListener('click', toggleTermMax);
  $('#termFollow').addEventListener('click', function(){
    S.settings.follow = !S.settings.follow;
    this.classList.toggle('on', S.settings.follow);
    this.setAttribute('aria-pressed', String(S.settings.follow));
    saveSettings();
    if (S.settings.follow && S.logs.length) showPayload(S.logs[S.logs.length - 1]);
  });
  $('#termCopy').addEventListener('click', () => {
    if (!term.current) return;
    navigator.clipboard?.writeText(JSON.stringify(term.current.msg, null, 2))
      .then(() => toast('Payload copied'))
      .catch(() => toast('Copy blocked by browser','warn'));
  });
}

/* ==================== GLOBAL EVENTS ==================== */
document.addEventListener('click', e => {
  const t = e.target;
  const tab = walkUp(t, '.tab');
  if (tab){ switchView(tab.dataset.view); return; }
  const act = walkUp(t, '[data-act]');
  if (act){
    const a = act.dataset.act;
    if (a === 'toggle-tool') toggleTool(act.closest('.tool').dataset.tool);
    else if (a === 'run-tool'){
      const name = act.closest('.tool').dataset.tool;
      const tool = S.tools.find(x => x.name === name);
      const args = tool && collectArgs(tool);
      if (tool && args !== null) callTool(name, args);
    }
    else if (a === 'example'){ const ex = EXAMPLE_ACTIONS[+act.dataset.i]; callTool(ex.tool, ex.args); }
    else if (a === 'db-search') dbSearch();
    else if (a === 'open-term') openTerminal();
    else if (a === 'clear-logs'){ S.logs = []; S.methodById.clear(); renderAllLogs(); toast('Local wire log cleared'); }
    else if (a === 'restart') restartServer();
    else if (a === 'reconnect') handshake().catch(() => setConn('offline'));
    else if (a === 'copy-script'){
      if (S.lastResult?.script) navigator.clipboard?.writeText(S.lastResult.script)
        .then(() => toast('Script copied to clipboard'))
        .catch(() => toast('Copy blocked by browser','warn'));
    }
    else if (a === 'to-validate'){ if (S.lastResult?.script) sendToValidate(S.lastResult.script); }
    else if (a === 'inspect-raw'){
      if (S.lastResult?.reply) openTerminal({ dir:'res', method:'tools/call · ' + S.lastResult.name, t:Date.now(), msg:S.lastResult.reply });
    }
    else if (a === 'close-result'){ const c = $('#resultCard'); if (c) c.style.display = 'none'; }
    else if (a === 'go-tool'){
      switchView('playground');
      setTimeout(() => {
        if (S.openTool !== act.dataset.tool) toggleTool(act.dataset.tool);
        const el = $('#tool-' + CSS.escape(act.dataset.tool));
        el?.scrollIntoView({ behavior:'smooth', block:'center' });
      }, 80);
    }
    else if (a === 'autoscroll'){
      S.settings.autoScroll = !S.settings.autoScroll;
      act.classList.toggle('on', S.settings.autoScroll);
      act.setAttribute('aria-pressed', String(S.settings.autoScroll));
      saveSettings();
      const body = $('#logBody'); if (body && S.settings.autoScroll) body.scrollTop = body.scrollHeight;
    }
    else if (a === 'swatch') applyAccent(act.dataset.color);
    else if (a === 'set-switch'){
      const key = act.dataset.key;
      S.settings[key] = !S.settings[key];
      act.setAttribute('aria-checked', String(S.settings[key]));
      saveSettings();
      if (key === 'reduceMotion') document.documentElement.classList.toggle('rm', S.settings.reduceMotion);
      if (key === 'follow'){ const fb = $('#termFollow'); if (fb){ fb.classList.toggle('on', S.settings.follow); fb.setAttribute('aria-pressed', String(S.settings.follow)); } }
    }
    return;
  }
  const line = walkUp(t, '.log-line');
  if (line) openLogEntry(line.dataset.id);
});
document.addEventListener('change', e => {
  if (e.target.id === 'accentPicker'){ applyAccent(e.target.value); toast('Custom accent applied'); }
});
document.addEventListener('keydown', e => {
  const inField = walkUp(e.target, 'input,textarea,select,[contenteditable]');
  if (inField){ if (e.key === 'Enter' && inField.id === 'dbQuery'){ e.preventDefault(); dbSearch(); } return; }
  if (e.key === 'Escape' && term.open){ closeTerminal(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k >= '1' && k <= '4') switchView(VIEWS[parseInt(k,10) - 1]);
  else if (k === 't'){ e.preventDefault(); term.open ? closeTerminal() : openTerminal(); }
});
$('#tabbar').addEventListener('keydown', e => {
  const idx = VIEWS.indexOf(S.view);
  let next = null;
  if (e.key === 'ArrowRight') next = VIEWS[(idx + 1) % VIEWS.length];
  else if (e.key === 'ArrowLeft') next = VIEWS[(idx - 1 + VIEWS.length) % VIEWS.length];
  else if (e.key === 'Home') next = VIEWS[0];
  else if (e.key === 'End') next = VIEWS[VIEWS.length - 1];
  else return;
  e.preventDefault(); switchView(next); $('#tab-' + next).focus();
});

/* ==================== PARALLAX ==================== */
function initParallax(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const l1 = $('#pxl1'), l2 = $('#pxl2');
  let tx = 0, ty = 0, cx = 0, cy = 0;
  addEventListener('pointermove', e => { tx = e.clientX/innerWidth - .5; ty = e.clientY/innerHeight - .5; }, { passive:true });
  (function loop(){
    cx += (tx - cx) * .045; cy += (ty - cy) * .045;
    if (!document.documentElement.classList.contains('rm')){
      l1.style.transform = 'translate3d(' + (cx*32) + 'px,' + (cy*24) + 'px,0)';
      l2.style.transform = 'translate3d(' + (cx*-52) + 'px,' + (cy*-40) + 'px,0)';
    }
    requestAnimationFrame(loop);
  })();
}

/* ==================== BOOT ==================== */
function boot(){
  loadSettings();
  applyAccent(S.settings.accent);
  if (S.settings.reduceMotion) document.documentElement.classList.add('rm');
  bindTerminal();
  connectEvents();
  renderView();
  $('#btnTermTop').addEventListener('click', () => openTerminal());
  handshake().catch(() => setConn('offline'));
  setInterval(() => { if (!S.handshaken && S.conn === 'offline') handshake().catch(() => {}); }, 5000);
  addEventListener('resize', () => {
    moveIndicator();
    if (term.open && !term.max){
      term.x = clamp(term.x, -term.w + 80, innerWidth - 80);
      term.y = clamp(term.y, 0, innerHeight - 56);
      termApply();
    }
  });
}
boot();
</script>
